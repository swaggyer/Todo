name: Build packages

# Packaging is manually triggered. This workflow does not publish releases or stores.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and build
        run: |
          pnpm check
          pnpm build
      - name: Archive static website
        run: |
          mkdir -p artifacts
          cd apps/web/dist
          zip -q -r "$GITHUB_WORKSPACE/artifacts/day-todo-web.zip" .
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum day-todo-web.zip > day-todo-web.zip.sha256
      - name: Upload website
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: day-todo-web
          path: artifacts/day-todo-web.zip*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and sync Android
        run: |
          pnpm check
          pnpm mobile:sync:android
      - name: Build installable debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Prepare APK and checksum
        run: |
          mkdir -p artifacts
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk artifacts/day-todo-android-debug.apk
          cd artifacts
          sha256sum day-todo-android-debug.apk > day-todo-android-debug.apk.sha256
      - name: Upload Android test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: day-todo-android-debug
          path: artifacts/day-todo-android-debug.apk*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios:
    name: iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - name: Verify Xcode version
        run: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR == 1 {print $2}' | cut -d. -f1)"
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::Capacitor 8 requires Xcode 26 or newer. Select a compatible macOS runner image."
            exit 1
          fi
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and sync iOS
        run: |
          pnpm check
          pnpm mobile:sync:ios
      - name: Build unsigned simulator app
        run: |
          xcodebuild \
            -project apps/mobile/ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive simulator app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app artifacts/day-todo-ios-simulator.zip
          cd artifacts
          shasum -a 256 day-todo-ios-simulator.zip > day-todo-ios-simulator.zip.sha256
      - name: Upload iOS simulator package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: day-todo-ios-simulator
          path: artifacts/day-todo-ios-simulator.zip*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
