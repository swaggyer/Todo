# Temporary publication for the renamed app; removed after verifying the public download.
name: Publish day todo 1.0.1 once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-day-todo-1-0-1-once.yml]
permissions: {}
concurrency:
  group: publish-day-todo-1-0-1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'swaggyer/Todo' && github.ref == 'refs/heads/main' && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the verified renamed app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified-apk
          gh run download 40898680931 --repo swaggyer/Todo --name day-todo-android-preview --dir verified-apk
          cd verified-apk
          printf '%s  %s\n' '099ba56b4fcf20b3a2428f7ae32996af8484b88292750e1ace553145baf937dd' 'day-todo-android-preview.apk' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish the updated Android download attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          day todo Android preview 1.0.1

          App renamed to day todo. New white Roman-style to / do monogram on a deep cobalt icon, including Android launcher and splash assets. Existing application ID and local data format are preserved.

          Download day-todo-android-preview.apk, open the downloaded file and confirm installation. No GitHub login or ZIP extraction is required.

          Debug-signed test build. Export your data before replacing or uninstalling the older preview; different debug signing keys may prevent an in-place update. Physical-device testing has not been performed.

          Built source: 7938a47e9583abaed2c0e1402fd2e97a307108f0
          APK SHA-256: 099ba56b4fcf20b3a2428f7ae32996af8484b88292750e1ace553145baf937dd
          NOTES
          gh release create android-preview-1.0.1 \
            verified-apk/day-todo-android-preview.apk verified-apk/SHA256SUMS.txt \
            --repo swaggyer/Todo --target "${{ github.sha }}" \
            --title "day todo Android preview 1.0.1" --notes-file release-notes.md \
            --prerelease --latest=false
