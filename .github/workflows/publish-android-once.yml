# Temporary one-time publication for the user's requested direct APK link.
# Remove this workflow from main after verifying the public release asset.
name: Publish Android download once

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-android-once.yml]

permissions: {}

concurrency:
  group: publish-android-preview-1-0-0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'swaggyer/Todo' && github.ref == 'refs/heads/main' && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the existing verified Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified-apk
          gh run download 40853667706 --repo swaggyer/Todo --name little-days-android-preview --dir verified-apk
          cd verified-apk
          printf '%s  %s\n' '4784fef8e324c083039fcb59baaac85756681b56978b8f238925b5d11cd91d06' 'little-days-android-preview.apk' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish this APK as a public download attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Android preview 1.0.0 for Little Days.

          Download little-days-android-preview.apk in your Android browser, open the downloaded file, and confirm installation when prompted. No ZIP extraction or GitHub login is required for the release attachment.

          This is the existing debug-signed test build from source commit bf5819561e8bf001caef9de81a7c99f49370139b. Native compilation and archive checks passed; physical-device testing has not been performed. Export your data before replacing or uninstalling this test version. Later builds may use a different debug signing key.

          APK SHA-256: 4784fef8e324c083039fcb59baaac85756681b56978b8f238925b5d11cd91d06
          NOTES
          gh release create android-preview-1.0.0 \
            verified-apk/little-days-android-preview.apk verified-apk/SHA256SUMS.txt \
            --repo swaggyer/Todo \
            --target "${{ github.sha }}" \
            --title "Little Days Android preview 1.0.0" \
            --notes-file release-notes.md \
            --prerelease --latest=false

